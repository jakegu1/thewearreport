[project]
name = "wearreport"
version = "0.0.0"
description = "Aggregate clothing counts from London's public traffic cameras."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "engine"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.isort]
known-first-party = ["wearreport", "license_check", "privacy_guard"]

[tool.ruff.lint.per-file-ignores]
"engine/tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["engine", "scripts"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers", "-ra"]
