name: sweep

# One sweep every 20 minutes in London daytime, published to the `data` branch (T-007).
# UTC cron at minutes 7, 27, 47 of hours 06-20 (off the busy top of the hour); the gate keeps 07:00-21:00 London.
# Cron and workflow_dispatch run from the default branch only. See README.md § Operations.
#
# Jobs:
#   gate     is it 07:00-21:00 Europe/London? (the cron is UTC; this job alone decides)
#   sweep    run one sweep against a read-only checkout of the `data` branch and upload
#            the new record and status.json as an artifact (contents: read)
#   publish  check that artifact and push it to the `data` branch; the only job that
#            writes contents. It runs no third-party code: first-party actions, git and
#            the runner's python3 with the engine's standard-library helpers only (T-034)
#   alert    after three consecutive failed sweeps open (or comment on) the `ops-alert`
#            issue; close it after a success. The only job that writes issues.
#
# Nothing here runs on pull requests, so repository secrets never reach fork code.

on:
  schedule:
    - cron: "7-59/20 6-20 * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Fail the sweep before it starts (tests the alert; publishes nothing)"
        type: boolean
        default: false

permissions: {}

# One group for every sweep: runs never overlap (status.json assumes it), and a queued
# run never cancels one in progress, so a publishing run always finishes.
concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      open: ${{ steps.gate.outputs.open }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: engine/wearreport
      # Manual runs from any ref but the default branch are refused: every branch
      # carries this file, and its code would run with the secrets and the write token.
      - name: Gate on London daytime and the default branch
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PYTHONPATH=engine python3 -m wearreport.schedule gate \
            --event "${EVENT}" --ref "${REF}" --default-branch "${DEFAULT_BRANCH}" \
            >> "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

  sweep:
    needs: gate
    if: needs.gate.outputs.open == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      stage: ${{ steps.result.outputs.stage }}
      skipped: ${{ steps.sweep.outputs.skipped }}
    env:
      DATA_REMOTE: https://github.com/${{ github.repository }}.git
    steps:
      - name: Forced failure (manual alert test; nothing is published)
        id: forced
        if: inputs.force_fail
        run: |
          echo "force_fail is set: failing before the sweep starts" >&2
          exit 1
      # The runner context is not available in job-level env, so DATA_DIR is set here.
      - name: Set DATA_DIR
        run: echo "DATA_DIR=${RUNNER_TEMP}/data" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install dependencies
        id: install
        run: uv sync --locked --no-dev
      - name: Restore the models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: yolox-${{ hashFiles('scripts/fetch_model.sh') }}
      - name: Fetch or verify the models (SHA-256 checked on every run)
        id: models
        run: sh scripts/fetch_model.sh --with-m
      - name: Save the models
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: yolox-${{ hashFiles('scripts/fetch_model.sh') }}
      - name: Check out the data branch (shallow, sparse; orphan on first publish)
        id: checkout-data
        run: |
          set -euo pipefail
          git init -q "${DATA_DIR}"
          cd "${DATA_DIR}"
          git remote add origin "${DATA_REMOTE}"
          rc=0
          git ls-remote --exit-code --heads origin refs/heads/data > /dev/null || rc=$?
          if [ "${rc}" -eq 0 ]; then
            # status.json and the last three UTC days of records: enough for the 24 h
            # window. Older days stay in git, not in the tree, unless needed below.
            git sparse-checkout set --no-cone /status.json \
              "/sweeps/$(date -u -d '2 days ago' +%Y/%m/%d)/" \
              "/sweeps/$(date -u -d '1 day ago' +%Y/%m/%d)/" \
              "/sweeps/$(date -u +%Y/%m/%d)/"
            git fetch -q --depth=1 --no-tags origin refs/heads/data
            git checkout -q -b data FETCH_HEAD
            # consecutive_failures counts back to the newest success, however old. When the
            # checked-out days do not show it, streak-days lists the older days to add,
            # newest first: it reads each day's records once from the fetched tip (which
            # holds every record, so no deeper fetch is needed) and stops at the first day
            # with a success, at the end of the history, or after its cap of days. The
            # records are checked as the publisher checks them, with the engine's venv.
            days="$(PYTHONPATH="${GITHUB_WORKSPACE}/engine" \
              "${GITHUB_WORKSPACE}/.venv/bin/python" -m wearreport.schedule streak-days \
              --data-dir . --before "sweeps/$(date -u -d '2 days ago' +%Y/%m/%d)")"
            if [ -n "${days}" ]; then
              mapfile -t add <<< "${days}"
              git sparse-checkout add "${add[@]}"
            fi
          elif [ "${rc}" -eq 2 ]; then
            echo "the data branch does not exist yet: starting it as an orphan"
            git checkout -q --orphan data
          else
            echo "cannot list the remote branches (git exit ${rc})" >&2
            exit 1
          fi
      - name: Sweep
        id: sweep
        env:
          WEARREPORT_ENV: production
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        # A sweep too soon after the last published one prints `sweep skipped:`, writes
        # nothing and exits 0; the step then outputs skipped=true (T-039).
        run: |
          set -euo pipefail
          uv run --locked --no-dev wearreport sweep --data-dir "${DATA_DIR}" \
            | tee "${RUNNER_TEMP}/sweep.out"
          if grep -q '^sweep skipped:' "${RUNNER_TEMP}/sweep.out"; then
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
          fi
      # The new record (untracked: records are immutable) and status.json, as the publish
      # job will stage them; nothing else leaves this job.
      - name: Collect the new record and status.json
        id: collect
        if: steps.sweep.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/outbox"
          cd "${DATA_DIR}"
          git ls-files -z --others --exclude-standard -- ':(glob)sweeps/**/*.json' \
            | xargs -0 -r cp --parents -t "${RUNNER_TEMP}/outbox" --
          cp -- status.json "${RUNNER_TEMP}/outbox/status.json"
          find "${RUNNER_TEMP}/outbox" -type f
      - name: Upload the new record and status.json for the publish job
        id: upload
        if: steps.sweep.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sweep-records
          path: |
            ${{ runner.temp }}/outbox/sweeps/**/*.json
            ${{ runner.temp }}/outbox/status.json
          if-no-files-found: error
          retention-days: 1
      - name: Result
        id: result
        if: always()
        env:
          FORCED: ${{ steps.forced.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          MODELS: ${{ steps.models.outcome }}
          CHECKOUT_DATA: ${{ steps.checkout-data.outcome }}
          SWEEP: ${{ steps.sweep.outcome }}
          SKIPPED: ${{ steps.sweep.outputs.skipped }}
          COLLECT: ${{ steps.collect.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          stage=unknown
          if [ "${FORCED}" = failure ]; then stage=forced
          elif [ "${INSTALL}" != success ] || [ "${MODELS}" != success ]; then stage=setup
          elif [ "${CHECKOUT_DATA}" != success ]; then stage=checkout
          elif [ "${SWEEP}" != success ]; then stage=sweep
          elif [ "${SKIPPED}" = true ]; then stage=skipped
          elif [ "${COLLECT}" != success ] || [ "${UPLOAD}" != success ]; then stage=publish
          else stage=none
          fi
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "stage=${stage}"


  publish:
    needs: sweep
    # Not after a skip: the sweep wrote nothing, so there is nothing to push.
    if: needs.sweep.outputs.skipped != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      stage: ${{ steps.result.outputs.stage }}
      consecutive_failures: ${{ steps.record.outputs.consecutive_failures }}
    env:
      DATA_REMOTE: https://github.com/${{ github.repository }}.git
    # The write token never meets third-party code: no setup-uv, no dependency, no make.
    # The helpers below are engine/wearreport/schedule.py (standard library only) from
    # the checked-out default branch; the downloaded files are data, never run.
    # PYTHONSAFEPATH=1 is python3 -P: the working directory (the data checkout, in the
    # commit step) is never on sys.path. test_sweep_workflow.py allowlists this job.
    steps:
      - name: Set DATA_DIR
        run: echo "DATA_DIR=${RUNNER_TEMP}/data" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: engine/wearreport
      - name: Download the new record and status.json
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sweep-records
          path: ${{ runner.temp }}/artifact
      # Only regular files; status.json and records the staged-path check accepts, each
      # JSON, at most 1 MiB and stored under its own sweep_id.
      - name: Check the downloaded files
        id: check
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: |
          set -euo pipefail
          PYTHONSAFEPATH=1 PYTHONPATH=engine python3 -m wearreport.schedule check-artifact \
            --dir "${ARTIFACT_DIR}" > "${RUNNER_TEMP}/paths-to-publish"
          cat "${RUNNER_TEMP}/paths-to-publish"
      - name: Check out the data branch (shallow, sparse; orphan on first publish)
        id: checkout-data
        run: |
          set -euo pipefail
          git init -q "${DATA_DIR}"
          cd "${DATA_DIR}"
          git remote add origin "${DATA_REMOTE}"
          rc=0
          git ls-remote --exit-code --heads origin refs/heads/data > /dev/null || rc=$?
          if [ "${rc}" -eq 0 ]; then
            # status.json and the days of the new records: the files this job writes
            mapfile -t days < <(sed -n \
              's#^\(sweeps/[0-9]\{4\}/[0-9]\{2\}/[0-9]\{2\}\)/[^/]*$#/\1/#p' \
              "${RUNNER_TEMP}/paths-to-publish" | sort -u)
            git sparse-checkout set --no-cone /status.json "${days[@]}"
            git fetch -q --depth=1 --no-tags origin refs/heads/data
            git checkout -q -b data FETCH_HEAD
          elif [ "${rc}" -eq 2 ]; then
            echo "the data branch does not exist yet: starting it as an orphan"
            git checkout -q --orphan data
          else
            echo "cannot list the remote branches (git exit ${rc})" >&2
            exit 1
          fi
      # An existing record must be identical (records are immutable); status.json is
      # replaced.
      - name: Copy the checked files into the data branch
        id: copy
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: |
          PYTHONSAFEPATH=1 PYTHONPATH=engine python3 -m wearreport.schedule copy-artifact \
            --artifact "${ARTIFACT_DIR}" --data-dir "${DATA_DIR}"
      - name: Commit and push to the data branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${DATA_DIR}"
          # Explicit paths only: new record files (sweeps/**/*.json; records are immutable,
          # so only untracked ones) and status.json. Never everything (-A or the dot).
          git ls-files -z --others --exclude-standard -- ':(glob)sweeps/**/*.json' \
            | xargs -0 -r git add --
          git add -- status.json
          git diff --cached --name-status | PYTHONSAFEPATH=1 \
            PYTHONPATH="${GITHUB_WORKSPACE}/engine" python3 -m wearreport.schedule check-staged
          if git diff --cached --quiet; then
            echo "nothing new to publish (the record was already there)"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Add sweep records (run ${GITHUB_RUN_ID})"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push -q origin HEAD:refs/heads/data
      - name: Did the published sweep succeed?
        id: record
        run: |
          PYTHONSAFEPATH=1 PYTHONPATH=engine python3 -m wearreport.schedule outcome \
            --status "${DATA_DIR}/status.json" >> "${GITHUB_OUTPUT}"
      - name: Result
        id: result
        if: always()
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CHECKOUT_DATA: ${{ steps.checkout-data.outcome }}
          COPY: ${{ steps.copy.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          RECORD: ${{ steps.record.outcome }}
        run: |
          stage=none
          for outcome in "${DOWNLOAD}" "${CHECK}" "${CHECKOUT_DATA}" "${COPY}" "${PUBLISH}"; do
            if [ "${outcome}" != success ]; then stage=publish; fi
          done
          if [ "${stage}" = none ] && [ "${RECORD}" != success ]; then stage=record; fi
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "stage=${stage}"

  alert:
    needs: [gate, sweep, publish]
    # Also after a failed gate, so a broken gate cannot silence every sweep unnoticed.
    if: ${{ !cancelled() && (needs.gate.outputs.open == 'true' || needs.gate.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: engine/wearreport
      - name: Open, update or close the ops-alert issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.gate.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          SWEEP_STAGE: ${{ needs.sweep.outputs.stage }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_STAGE: ${{ needs.publish.outputs.stage }}
          RECORD_FAILURES: ${{ needs.publish.outputs.consecutive_failures }}
        run: |
          PYTHONPATH=engine python3 -m wearreport.schedule alert \
            --gate-result "${GATE_RESULT}" --sweep-result "${SWEEP_RESULT}" \
            --publish-result "${PUBLISH_RESULT}" \
            --stage "${SWEEP_STAGE}" --publish-stage "${PUBLISH_STAGE}" \
            --record-failures "${RECORD_FAILURES}"
