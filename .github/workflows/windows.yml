name: windows

# The spot-check on native Windows (T-037). Kept out of ci.yml, whose jobs all run on
# ubuntu-24.04. Read-only; it uses no secrets at all.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The spot-check on native Windows (T-037): its unit and acceptance tests, the
    # window reviewer driven by synthetic key events, and a dry run through the window.
    # T-067: the labelling launcher (label.cmd, scripts/label.ps1) end to end, offline.
    # T-073: the London launcher (label-london.cmd) end to end, offline.
    # T-080: the launcher's default label folder, restart after a pull, version line.
    # The T-008 acceptance tests describe the Unix files view and run on Linux only.
    # llama-cpp-python has no Windows wheel, and the spot-check never imports it.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Model- and Tk-dependent tests fail, instead of skipping, when either is missing.
      WEARREPORT_REQUIRE_MODEL: "1"
      WEARREPORT_REQUIRE_TK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install dependencies (without llama-cpp-python)
        run: uv sync --locked --no-install-package llama-cpp-python
      - name: Fetch the YOLOX-s and YOLOX-m models (SHA-256 verified)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_model.ps1
      - name: Spot-check unit and acceptance tests
        # --capture=sys: pytest's default capture swaps the process's standard handles
        # for every test and closes them after it. Tcl keeps the standard channels it
        # made from those handles for the life of the process, so once a handle is
        # reused Tk fails at random to read its own library ("Can't find a usable
        # init.tcl"). The tool itself never swaps them.
        run: >-
          uv run --no-sync pytest -v -rs --capture=sys
          engine/tests/unit/test_spotcheck.py
          engine/tests/unit/test_spotcheck_window.py
          engine/tests/acceptance/test_t_036.py
          engine/tests/acceptance/test_t_037.py
          engine/tests/acceptance/test_t_061.py
      - name: Labelling launcher tests (T-067)
        # Windows PowerShell runs label.ps1 with spotcheck's dry run, a test reviewer, a
        # fake judge on 127.0.0.1, fake git and uv, and a file in place of the clipboard.
        # T-073: label-london.cmd (one London pass, no judge) with the same fakes. T-080:
        # the default label folder, the restart after a pull and the version line. -rP
        # prints the passed tests' output: the launcher's lines and spotcheck's arguments.
        run: >-
          uv run --no-sync pytest -v -rsP --capture=sys
          engine/tests/acceptance/test_t_067.py
          engine/tests/acceptance/test_t_073.py
          engine/tests/acceptance/test_t_080.py
          engine/tests/unit/test_label_window.py
      - name: Dry-run spot-check through the window reviewer
        run: >-
          uv run --no-sync pytest -v -s
          "engine/tests/acceptance/test_t_037.py::test_ac5_dry_run_with_the_window_reviewer_writes_statistics_and_no_image"
