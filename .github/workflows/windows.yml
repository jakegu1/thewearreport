name: windows

# The spot-check on native Windows (T-037). Kept out of ci.yml, whose jobs all run on
# ubuntu-24.04. Read-only, no secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The spot-check on native Windows (T-037): its unit and acceptance tests, the
    # window reviewer driven by synthetic key events, and a dry run through the window.
    # The T-008 acceptance tests describe the Unix files view and run on Linux only.
    # llama-cpp-python has no Windows wheel, and the spot-check never imports it.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Model- and Tk-dependent tests fail, instead of skipping, when either is missing.
      WEARREPORT_REQUIRE_MODEL: "1"
      WEARREPORT_REQUIRE_TK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install dependencies (without llama-cpp-python)
        run: uv sync --locked --no-install-package llama-cpp-python
      - name: Fetch the YOLOX-s and YOLOX-m models (SHA-256 verified)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_model.ps1
      - name: "TEMPORARY: Tk create/destroy stress (diagnosis for T-037)"
        continue-on-error: true
        run: |
          $code = @'
          import os, sys, tempfile, tkinter
          print("base_prefix", sys.base_prefix, "cwd", os.getcwd(), flush=True)
          def cycle(label, n, between=None):
              bad = 0
              for i in range(n):
                  if between: between(i)
                  try:
                      r = tkinter.Tk(); r.update(); r.destroy(); del r
                  except Exception as exc:
                      bad += 1
                      if bad <= 2: print(label, "FAILED at", i, repr(exc)[:160], flush=True)
              print(label, "failures", bad, "of", n, flush=True)
          start = os.getcwd()
          base = tempfile.mkdtemp()
          cycle("plain", 60)
          def chdir_new(i):
              d = os.path.join(base, "c%d" % i); os.mkdir(d); os.chdir(d)
          cycle("chdir-new-dir", 60, chdir_new)
          os.chdir(start)
          def chdir_back_and_forth(i):
              os.chdir(base if i % 2 else start)
          cycle("chdir-two-dirs", 60, chdir_back_and_forth)
          os.chdir(start)
          def env_only(i):
              d = os.path.join(base, "e%d" % i); os.mkdir(d)
              for v in ("HOME", "USERPROFILE", "TEMP", "TMP", "TMPDIR"): os.environ[v] = d
          cycle("env-only", 60, env_only)
          def userprofile_only(i):
              d = os.path.join(base, "u%d" % i); os.mkdir(d); os.environ["USERPROFILE"] = d
          cycle("userprofile-only", 60, userprofile_only)
          def home_only(i):
              d = os.path.join(base, "h%d" % i); os.mkdir(d); os.environ["HOME"] = d
          cycle("home-only", 60, home_only)
          def temp_only(i):
              d = os.path.join(base, "t%d" % i); os.mkdir(d)
              for v in ("TEMP", "TMP"): os.environ[v] = d
          cycle("temp-only", 60, temp_only)
          '@
          $code | uv run --no-sync python -u -
      - name: Spot-check unit and acceptance tests
        run: >-
          uv run --no-sync pytest -v -rs
          engine/tests/unit/test_spotcheck.py
          engine/tests/unit/test_spotcheck_window.py
          engine/tests/acceptance/test_t_037.py
      - name: Dry-run spot-check through the window reviewer
        run: >-
          uv run --no-sync pytest -v -s
          "engine/tests/acceptance/test_t_037.py::test_ac5_dry_run_with_the_window_reviewer_writes_statistics_and_no_image"
