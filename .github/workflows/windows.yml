name: windows

# The spot-check on native Windows (T-037). Kept out of ci.yml, whose jobs all run on
# ubuntu-24.04. Read-only, no secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The spot-check on native Windows (T-037): its unit and acceptance tests, the
    # window reviewer driven by synthetic key events, and a dry run through the window.
    # The T-008 acceptance tests describe the Unix files view and run on Linux only.
    # llama-cpp-python has no Windows wheel, and the spot-check never imports it.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Model- and Tk-dependent tests fail, instead of skipping, when either is missing.
      WEARREPORT_REQUIRE_MODEL: "1"
      WEARREPORT_REQUIRE_TK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install dependencies (without llama-cpp-python)
        run: uv sync --locked --no-install-package llama-cpp-python
      - name: Fetch the YOLOX-s and YOLOX-m models (SHA-256 verified)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_model.ps1
      - name: "TEMPORARY: Tk failure diagnosis (T-037)"
        continue-on-error: true
        run: |
          $plugin = @'
          import os, subprocess, sys, threading, time, tkinter
          _real = tkinter.Tk.__init__
          _count = [0]
          def _init(self, *args, **kwargs):
              _count[0] += 1
              try:
                  _real(self, *args, **kwargs)
              except tkinter.TclError as exc:
                  init = os.path.join(sys.base_prefix, "tcl", "tcl8.6", "init.tcl")
                  print("\nTKDIAG failure at Tk #%d: %s" % (_count[0], str(exc).splitlines()[0]), flush=True)
                  print("TKDIAG threads:", [(t.name, t.daemon) for t in threading.enumerate()], flush=True)
                  print("TKDIAG cwd:", os.getcwd(), "exists:", os.path.exists(init), flush=True)
                  try:
                      with open(init, "rb") as fh:
                          print("TKDIAG python read ok:", len(fh.read()), flush=True)
                  except OSError as err:
                      print("TKDIAG python read failed:", err, flush=True)
                  for attempt in range(1, 6):
                      time.sleep(0.2)
                      try:
                          tkinter.Tk().destroy()
                          print("TKDIAG retry", attempt, "ok", flush=True)
                          break
                      except tkinter.TclError as again:
                          print("TKDIAG retry", attempt, "failed:", str(again).splitlines()[-3:], flush=True)
                  child = subprocess.run([sys.executable, "-c", "import tkinter; tkinter.Tk().destroy(); print('child ok')"], capture_output=True, text=True)
                  print("TKDIAG fresh process:", child.returncode, child.stdout.strip(), child.stderr.strip()[-200:], flush=True)
                  raise
          tkinter.Tk.__init__ = _init
          '@
          $dir = Join-Path $env:RUNNER_TEMP "tkdiag"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir "tkdiag.py") -Value $plugin -Encoding utf8
          $env:PYTHONPATH = $dir
          uv run --no-sync pytest -q -s -p tkdiag engine/tests/unit/test_spotcheck.py engine/tests/unit/test_spotcheck_window.py engine/tests/acceptance/test_t_037.py 2>&1 | Select-String -Pattern "TKDIAG|passed|failed"
      - name: Spot-check unit and acceptance tests
        run: >-
          uv run --no-sync pytest -v -rs
          engine/tests/unit/test_spotcheck.py
          engine/tests/unit/test_spotcheck_window.py
          engine/tests/acceptance/test_t_037.py
      - name: Dry-run spot-check through the window reviewer
        run: >-
          uv run --no-sync pytest -v -s
          "engine/tests/acceptance/test_t_037.py::test_ac5_dry_run_with_the_window_reviewer_writes_statistics_and_no_image"
