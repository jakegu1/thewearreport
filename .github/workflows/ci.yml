name: ci

# Lint, types, tests, licences, privacy guard, schemas, workflow lint and secret scan.
# Mirrors `make check` (the public guard runs in public-guard.yml). See AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Model-dependent tests fail, instead of skipping, when the model is missing.
      WEARREPORT_REQUIRE_MODEL: "1"
      # The workflow lint test fails, instead of skipping, when actionlint is missing.
      WEARREPORT_REQUIRE_ACTIONLINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Fetch the YOLOX-s and YOLOX-m models (SHA-256 verified)
        run: sh scripts/fetch_model.sh --with-m
      - name: Install actionlint (SHA-256 verified)
        run: sh scripts/install_actionlint.sh
      - name: actionlint (every workflow)
        run: .tools/bin/actionlint -shellcheck= -pyflakes=
      - name: ruff check
        run: uv run --locked ruff check engine scripts
      - name: ruff format --check
        run: uv run --locked ruff format --check engine scripts
      - name: mypy --strict
        run: uv run --locked mypy --strict engine scripts
      - name: pytest
        run: uv run --locked pytest
      - name: Schema validation
        run: uv run --locked pytest engine/tests/unit/test_schemas.py
      - name: Licence check (runtime dependencies)
        run: uv run --locked python scripts/license_check.py
      - name: Privacy guard
        run: uv run --locked python scripts/privacy_guard.py
      - name: Detector latency (information only)
        run: uv run --locked python -m wearreport.benchmark --synthetic 20

  windows:
    # The spot-check on native Windows (T-037): its unit and acceptance tests, the
    # window reviewer driven by synthetic key events, and a dry run through the window.
    # llama-cpp-python has no Windows wheel, and the spot-check never imports it.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Model- and Tk-dependent tests fail, instead of skipping, when either is missing.
      WEARREPORT_REQUIRE_MODEL: "1"
      WEARREPORT_REQUIRE_TK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install dependencies (without llama-cpp-python)
        run: uv sync --locked --no-install-package llama-cpp-python
      - name: Fetch the YOLOX-s and YOLOX-m models (SHA-256 verified)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_model.ps1
      - name: Spot-check unit and acceptance tests
        run: >-
          uv run --no-sync pytest -v -rs
          engine/tests/unit/test_spotcheck.py
          engine/tests/acceptance/test_t_037.py
          engine/tests/acceptance/test_t_008.py
      - name: Dry-run spot-check through the window reviewer
        run: >-
          uv run --no-sync pytest -v -s
          "engine/tests/acceptance/test_t_037.py::test_ac5_dry_run_with_the_window_reviewer_writes_statistics_and_no_image"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: sh scripts/install_gitleaks.sh
      - name: gitleaks (full history)
        run: .tools/bin/gitleaks git --no-banner --redact .
