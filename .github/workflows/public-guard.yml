name: public-guard

# Blocks private project material, images and oversized files from this public repository.
# See tools/public_guard.py and AGENTS.md INV-9.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Working tree
        run: python3 tools/public_guard.py
      - name: Full history
        run: python3 tools/public_guard.py --history
